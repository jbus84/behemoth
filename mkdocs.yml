site_name: Behemoth Strategy
site_description: Production documentation for the Behemoth trading system
site_author: Behemoth
docs_dir: docs
site_dir: site
repo_url: https://github.com-jbus84/behemoth

theme:
  name: material
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
  palette:
    - scheme: default
      primary: blue
      accent: teal

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed
  - pymdownx.tasklist
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
            - .
          options:
            show_source: true
            show_root_heading: true
            show_signature_annotations: true

nav:
  - Overview: index.md
  - Strategy Manual: STRATEGY_MASTER_MANUAL.md
  - Architecture: architecture.md
  - API: api.md
  - API Reference: api_reference.md
  - OpenAPI: openapi.md
  - Core Reference: core_reference.md
  - Risk Controls: risk_controls.md
  - Monitoring: monitoring.md
  - Data Pipeline: data_pipeline.md
  - Validation: validation.md
  - Config Reference: config_reference.md
  - Code Reference: code_reference.md
  - Development: development.md
  - Deployment: deployment.md
  - DB Schema: db_schema.md
  - DB Diagram: db_schema_diagram.md
