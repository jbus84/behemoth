[project]
name = "behemoth"
version = "0.1.0"
description = "Behemoth Trading Strategy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=0.20.0",
    "numpy>=1.24.0",
    "catboost>=1.2",
    "scikit-learn>=1.3.0",
    "tqdm>=4.66.0",
    "joblib>=1.3.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0"
]

[tool.uv]
dev-dependencies = [
    "ipykernel>=6.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pytest>=7.4.0"
]
