[project]
name = "behemoth"
version = "0.7.0"
description = "Behemoth Trading Strategy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=0.20.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.66.0",
    "joblib>=1.3.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "fastapi[standard]>=0.110.0",
    "uvicorn>=0.27.0",
    "duckdb>=1.1.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.1",
    "pyyaml>=6.0.1",
    "prometheus-client>=0.20.0",
    "python-json-logger>=2.0.7",
    "pytz>=2025.2",
    "catboost>=1.2.10",
    "tabulate>=0.9.0",
]



[tool.uv]
dev-dependencies = [
    "ipykernel>=6.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "coverage>=7.4.0",
    "httpx>=0.27.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.7",
    "mkdocstrings[python]>=0.24.0",
    "pre-commit>=3.7.0",
    "ruff>=0.6.8",
    "ty>=0.0.16",
    "xenon>=0.9.3",
    "radon>=6.0.1",
    "vulture>=2.14",
    "smellcheck>=0.3.8",
    "commitizen>=4.1.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "W",  # pycodestyle warnings
    "I",  # isort
    "B",  # flake8-bugbear
    "UP", # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length handled by formatter
    "B008", # FastAPI Depends in defaults
    "B904", # HTTPException raised without chaining
    "B017", # Asserting blind Exception in tests (often for Pydantic/pytest)
    "B905", # zip() without strict= parameter
    "E741", # Ambiguous variable name (e.g. 'l' for low/line)
    "B023", # Function definition does not bind loop variable
]

[tool.ty.rules]
# Treat pre-existing type noise as ignored to allow build to pass
"unresolved-attribute" = "ignore"
"unresolved-reference" = "ignore"
"possibly-missing-attribute" = "ignore"
"unsupported-operator" = "ignore"
"not-iterable" = "ignore"
"not-subscriptable" = "ignore"
"invalid-argument-type" = "ignore"
"invalid-return-type" = "ignore"
"invalid-assignment" = "ignore"
"unresolved-import" = "ignore"
"no-matching-overload" = "ignore"
"call-non-callable" = "ignore"
"unused-type-ignore-comment" = "ignore"

[tool.vulture]
exclude = ["*schema*"]
ignore_decorators = ["@validator", "@root_validator", "@computed_field"]
ignore_names = ["*schema*", "test_*", "OPEN", "CLOSED", "CANCELLED"]
min_confidence = 80

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.7.0"
version_files = ["pyproject.toml:^version"]
tag_format = "v$version"
changelog_file = "CHANGELOG.md"
update_changelog_on_bump = true
