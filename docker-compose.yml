services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: behemoth
      POSTGRES_PASSWORD: behemoth
      POSTGRES_DB: behemoth
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U behemoth"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg2://behemoth:behemoth@db:5432/behemoth
      REDIS_URL: redis://redis:6379/0
      AUTO_CREATE_TABLES: "false"
      ENABLE_REDIS: "true"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
