version: 1
description: Operator action thresholds for OCO strategy bible metrics.

action_definitions:
  A0_MONITOR: Metric within policy band.
  A1_REVIEW: Investigate and monitor; no deploy block by itself.
  A2_RECALIBRATE: Recalibrate threshold/cost assumptions for the affected symbol.
  A3_HALT_AND_REMEDIATE: Block deployment for symbol until remediation and rerun.
  A9_DATA_GAP: Data/schema gap; restore artifact integrity before governance sign-off.

rules:
  - metric_id: D16_spread_regime_shift_z
    stage_id: 1
    mode: abs_ge
    warn: 2.0
    fail: 3.0
    owner: research
    rationale: Spread regime shift can invalidate cost assumptions.
    action_warn: A2_RECALIBRATE
    action_fail: A3_HALT_AND_REMEDIATE

  - metric_id: D17_gap_burst_ratio
    stage_id: 1
    mode: ge
    warn: 0.02
    fail: 0.05
    owner: data
    rationale: Excess large gaps suggest unstable data feed quality.
    action_warn: A1_REVIEW
    action_fail: A3_HALT_AND_REMEDIATE

  - metric_id: D18_clock_jitter_cv
    stage_id: 1
    mode: ge
    warn: 2.0
    fail: 3.0
    owner: data
    rationale: Timestamp jitter threatens ordering assumptions.
    action_warn: A1_REVIEW
    action_fail: A3_HALT_AND_REMEDIATE

  - metric_id: W13_threshold_fragility
    stage_id: 3
    mode: ge
    warn: 2.5
    fail: 4.0
    owner: research
    rationale: Fragile threshold response suggests unstable selection edge.
    action_warn: A2_RECALIBRATE
    action_fail: A3_HALT_AND_REMEDIATE

  - metric_id: W14_brier_drift_std
    stage_id: 3
    mode: ge
    warn: 0.01
    fail: 0.02
    owner: research
    rationale: Calibration drift can break probability gating quality.
    action_warn: A1_REVIEW
    action_fail: A2_RECALIBRATE

  - metric_id: W15_selection_turnover
    stage_id: 3
    mode: ge
    warn: 0.25
    fail: 0.40
    owner: research
    rationale: Excess turnover implies unstable selected state identity.
    action_warn: A1_REVIEW
    action_fail: A2_RECALIBRATE

  - metric_id: E11_session_overshoot_dispersion
    stage_id: 4
    mode: ge
    warn: 0.35
    fail: 0.50
    owner: execution
    rationale: Overshoot dispersion increases stop-limit execution uncertainty.
    action_warn: A2_RECALIBRATE
    action_fail: A3_HALT_AND_REMEDIATE

  - metric_id: E12_cap_plateau_width_pips
    stage_id: 4
    mode: le
    warn: 0.15
    fail: 0.05
    owner: execution
    rationale: Narrow cap plateau indicates unstable cap setting.
    action_warn: A1_REVIEW
    action_fail: A2_RECALIBRATE

  - metric_id: E13_nonfill_opportunity_cost_pips
    stage_id: 4
    mode: ge
    warn: 0.25
    fail: 0.40
    owner: execution
    rationale: Large non-fill opportunity cost suggests cap too restrictive.
    action_warn: A2_RECALIBRATE
    action_fail: A3_HALT_AND_REMEDIATE

  - metric_id: R02_top_state_dependency
    stage_id: 5
    mode: ge
    warn: 0.70
    fail: 0.85
    owner: research
    rationale: Over-dependence on few states weakens diversification robustness.
    action_warn: A1_REVIEW
    action_fail: A2_RECALIBRATE

  - metric_id: S01_lb95_dependence_gap
    stage_id: 7
    mode: abs_ge
    warn: 0.25
    fail: 0.50
    owner: research
    rationale: Large dependence gap indicates fragile inferential claims.
    action_warn: A1_REVIEW
    action_fail: A2_RECALIBRATE

  - metric_id: S02_practical_lb95_gt0
    stage_id: 7
    mode: lt
    warn: 1.0
    fail: 0.5
    owner: research
    rationale: Practical lower bound should remain positive.
    action_warn: A2_RECALIBRATE
    action_fail: A3_HALT_AND_REMEDIATE

  - metric_id: T01_stress_elasticity
    stage_id: 8
    mode: ge
    warn: 1.5
    fail: 2.0
    owner: risk
    rationale: High stress elasticity indicates brittle PnL response.
    action_warn: A1_REVIEW
    action_fail: A2_RECALIBRATE

  - metric_id: T02_first_negative_costplus
    stage_id: 8
    mode: le
    warn: 1.0
    fail: 0.5
    owner: risk
    rationale: Strategy should remain positive through conservative costplus scenarios.
    action_warn: A1_REVIEW
    action_fail: A2_RECALIBRATE

  - metric_id: T03_post_worst_month_recovery
    stage_id: 8
    mode: le
    warn: 0.75
    fail: 0.50
    owner: risk
    rationale: Recovery factor below 1 indicates incomplete resilience.
    action_warn: A1_REVIEW
    action_fail: A2_RECALIBRATE

  - metric_id: G01_near_fail_count
    stage_id: 9
    mode: ge
    warn: 3
    fail: 5
    owner: governance
    rationale: Near-fails indicate narrowing safety margin.
    action_warn: A1_REVIEW
    action_fail: A3_HALT_AND_REMEDIATE

  - metric_id: G03_lock_drift_flags
    stage_id: 9
    mode: gt
    warn: 0
    fail: 1
    owner: governance
    rationale: Any lock drift threatens deployment integrity.
    action_warn: A3_HALT_AND_REMEDIATE
    action_fail: A3_HALT_AND_REMEDIATE

  - metric_id: FTMO_ALLOC_BLOCK_RATE
    stage_id: 10
    mode: ge
    warn: 0.35
    fail: 0.55
    owner: risk
    rationale: High allocator blocking reduces live execution coverage.
    action_warn: A1_REVIEW
    action_fail: A2_RECALIBRATE

  - metric_id: FTMO_ALLOC_BUDGET_EXCEEDED_RATE
    stage_id: 10
    mode: ge
    warn: 0.15
    fail: 0.30
    owner: risk
    rationale: Budget-exceeded blocks imply allocator budget mis-sizing versus flow.
    action_warn: A1_REVIEW
    action_fail: A2_RECALIBRATE

  - metric_id: FTMO_ALLOC_PIP_VALUE_UNAVAILABLE_RATE
    stage_id: 10
    mode: ge
    warn: 0.005
    fail: 0.02
    owner: data
    rationale: Missing FX conversion for pip value breaks reservation accounting.
    action_warn: A9_DATA_GAP
    action_fail: A9_DATA_GAP

  - metric_id: FTMO_ALLOC_STALE_PENDING_COUNT
    stage_id: 10
    mode: ge
    warn: 1
    fail: 3
    owner: execution
    rationale: Stale pending reservations can incorrectly consume FTMO budget headroom.
    action_warn: A1_REVIEW
    action_fail: A3_HALT_AND_REMEDIATE

  - metric_id: FTMO_ALLOC_OPEN_WITHOUT_BROKER_POS_COUNT
    stage_id: 10
    mode: ge
    warn: 1
    fail: 2
    owner: execution
    rationale: Open reservations without broker ids indicate lifecycle desynchronization.
    action_warn: A1_REVIEW
    action_fail: A3_HALT_AND_REMEDIATE

  - metric_id: FTMO_ALLOC_ADMITTED_MISSING_RESERVATION_ID_COUNT
    stage_id: 10
    mode: ge
    warn: 1
    fail: 2
    owner: risk
    rationale: Admitted trades must always map to a concrete reservation id.
    action_warn: A2_RECALIBRATE
    action_fail: A3_HALT_AND_REMEDIATE

  - metric_id: EM03_prob_negative_month_s1
    stage_id: 11
    mode: ge
    warn: 0.30
    fail: 0.35
    owner: risk
    rationale: Elevated downside month probability in mild stress is unacceptable.
    action_warn: A1_REVIEW
    action_fail: A2_RECALIBRATE

  - metric_id: EM04_fill_rate_drop_vs_s0_s1
    stage_id: 11
    mode: ge
    warn: 0.08
    fail: 0.12
    owner: execution
    rationale: Mild stress should not materially degrade fill rates.
    action_warn: A1_REVIEW
    action_fail: A2_RECALIBRATE

  - metric_id: EM05_nan_core_fields
    stage_id: 11
    mode: gt
    warn: 0
    fail: 0
    owner: data
    rationale: NaNs in core MC fields invalidate stress outcomes.
    action_warn: A9_DATA_GAP
    action_fail: A9_DATA_GAP
