# _governance_template.yaml - canonical reference for symbol governance configs.
#
# Copy this file when onboarding a new symbol. Save as
# `<sym>_governance.yaml`. All fields below are REQUIRED; missing
# fields are a hard error at load time.
#
# Authoritative schema: src/behemoth/governance/symbol_config.py
# (REQUIRED_PER_FAMILY_FIELDS lists per-family required keys).

# ------------------------------------------------------------
# Top-level fields
# ------------------------------------------------------------

symbol: EURUSD
# Uppercase ISO pair, must match Velocity Dataset artifact names
# (data/analysis/tick_velocity/EURUSD_<bar_ticks>tick_velocity.parquet).

model_month: 2026-05
# Governance lifetime tag in YYYY-MM format. Freeze artifacts produced
# by this YAML are tagged with this value.

required_families:
  - oco_first_touch
# Symbol-level GO requires every listed family's verdict to be GO. Order
# does not matter. Must be at least one entry.
# Available family names: oco_first_touch, oco_asymmetric, directional,
# directional_inverse, directional_run, double_touch, pullback,
# dollar_residual, dispersion_rank, lead_lag. no_touch is opt-in only.

# ------------------------------------------------------------
# Per-family thresholds. MUST include a block for every family in
# `required_families`. May include extra blocks for diagnostic
# comparison; those extra blocks do not affect GO/NO_GO.
# ------------------------------------------------------------

families:
  oco_first_touch:
    capacity_floor_monthly: 200
    # Minimum filled signals per month averaged across the train window.

    capacity_floor_annual: 500
    # Annualized signal capacity floor.

    max_state_churn: 0.45
    # Maximum allowed state turnover between train months.

    max_top_state_share: 0.35
    # Maximum signal share held by the most-active state.

    max_state_hhi: 0.25
    # Maximum state concentration by Herfindahl-Hirschman Index.

    state_train_months: 2
    # Number of prior months used for rolling state selection.

    min_states: 1
    # Minimum number of qualifying states required for family GO.

    max_states: 12
    # Maximum number of states admitted after ranking.

    selection_gates:
      min_both_window_rate: 0.5
      # OCO first-touch minimum rate where both barriers are touched.

      min_p_up_first: 0.4
      # OCO first-touch minimum probability that the upper barrier hits first.

  # Uncomment after the directional_run adapter is registered.
  # directional_run:
  #   capacity_floor_monthly: 300
  #   capacity_floor_annual: 800
  #   max_state_churn: 0.45
  #   max_top_state_share: 0.35
  #   max_state_hhi: 0.25
  #   state_train_months: 2
  #   min_states: 1
  #   max_states: 12
  #   selection_gates: {}
  #   directional_run has no family-specific gates beyond the universal
  #   ones; provide an empty dict to declare "no extra gates".
