symbol: USDCAD
dataset_dir: data/analysis/tick_velocity

# Tick universes and forecast horizons
bar_ticks_grid: "100,1000,2000,5000,10000"
horizons: "1,3,6"
barrier_grid_pips: "1,3,8"

# Strict causal split
train_years: "2022,2023,2024"
test_year: 2025

# Gross-first opportunity mining (for downstream ML filtering)
min_annual_fills: 5000
baseline_draws: 20  # was 200 (default); 20-draw z estimate has SE ~0.22 vs ~0.07, ~10x faster
gross_metric: mean
library_type: all

out_dir: data/analysis/tick_opportunity_mining
report_out: docs/analysis/usdcad_tick_opportunity_mining_report.md
