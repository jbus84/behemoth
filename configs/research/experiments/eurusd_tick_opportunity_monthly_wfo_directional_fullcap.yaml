symbol: EURUSD
dataset_dir: data/analysis/tick_velocity
candidate_dir: data/analysis/tick_opportunity_mining

library: directional
families: [directional]
train_years_for_state_fit: "2022,2023,2024"
eval_start_month: "2025-01"
eval_end_month: "2026-03"
eval_year: 2026

min_candidate_train_count: 2000
max_candidates_per_library: 300
max_events_per_candidate: 20000

rolling_train_months: 3
min_month_train_rows: 1000
min_month_test_rows: 300
min_candidate_rows_in_train_window: 100
threshold_quantiles: "0.5,0.6,0.7,0.8,0.9,0.95"
oco_include_no_touch: false
threshold_mode: rolling_days
rolling_threshold_days: 20
rolling_threshold_min_history: 300
execution_quantile: 0.9
oco_hold_mode: from_touch
seed: 42

out_dir: data/analysis/tick_opportunity_mining/wfo_m3to1_directional_fullcap
report_out: docs/analysis/eurusd_tick_opportunity_monthly_wfo_directional_fullcap_report.md
