symbol: USDCHF
dataset_dir: data/analysis/tick_velocity
candidate_dir: data/analysis/tick_opportunity_mining

# cross-year causal window (extended into 2026)
library: oco
train_years_for_state_fit: "2022,2023,2024"
eval_start_month: "2025-01"
eval_end_month: "2026-02"

# full-cap style (materially larger than fast caps)
min_candidate_train_count: 15000
max_candidates_per_library: 300
max_events_per_candidate: 20000

# rolling WFO in eval year
rolling_train_months: 3
min_month_train_rows: 5000
min_month_test_rows: 1500
min_candidate_rows_in_train_window: 300
threshold_quantiles: "0.5,0.6,0.7,0.8,0.9,0.95"
oco_include_no_touch: true
threshold_mode: rolling_days
rolling_threshold_days: 20
rolling_threshold_min_history: 1000
execution_quantile: 0.9
oco_hold_mode: from_touch
seed: 42

out_dir: data/analysis/tick_opportunity_mining/wfo_m3to1_oco_fullcap
report_out: docs/analysis/usdchf_tick_opportunity_monthly_wfo_oco_fullcap_report.md
