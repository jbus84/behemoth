version: 1
default_expiry_days: 60
max_amber_consecutive_runs: 6
max_amber_months: 12
require_owner: true
require_rationale: true
require_evidence_link: true
hard_fail_on_expired_exception: true
hard_fail_on_recurrence_breach: true
rules:
  - metric_id: E_DRIFT_OVERSHOOT_P50
    symbols: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD]
    disposition: accepted_exception
    owner: execution_research
    rationale: "Observed overshoot p50 drift is moderate and not persistent across symbols."
    review_cadence_days: 30
    evidence_link: docs/analysis/oco_execution_drift_report.md
  - metric_id: E_DRIFT_OVERSHOOT_P95
    symbols: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD]
    disposition: accepted_exception
    owner: execution_research
    rationale: "Tail drift remains amber-only and below fail thresholds."
    review_cadence_days: 30
    evidence_link: docs/analysis/oco_execution_drift_report.md
  - metric_id: TS03_LB95_MONTH_SIGNAL
    symbols: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD]
    disposition: accepted_exception
    owner: wfo_research
    rationale: "LB95 signal floor is a monitoring warning; hard gates remain positive."
    review_cadence_days: 30
  - metric_id: fill_rate_envelope_monthly
    symbols: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD]
    disposition: accepted_exception
    owner: execution_research
    rationale: "Low fill rate observed in 2026-02 catch-up month is likely due to data sparsity during bridge; monitoring for recovery."
    review_cadence_days: 30
    evidence_link: docs/analysis/oco_execution_risk_report.md
  - metric_id: state_execution_fragility
    symbols: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD]
    disposition: accepted_exception
    owner: execution_research
    rationale: "State fragility is elevated in 2026-02 catch-up; monitoring for stability."
    review_cadence_days: 30
    evidence_link: docs/analysis/oco_execution_risk_report.md
  - metric_id: worst_window_stress_guard
    symbols: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD]
    disposition: accepted_exception
    owner: execution_research
    rationale: "Stress guard breaches in 2026-02 catch-up; monitoring for recovery."
    review_cadence_days: 30
    evidence_link: docs/analysis/oco_execution_risk_report.md
  - metric_id: overshoot_tail_control
    symbols: [EURUSD, GBPUSD, USDJPY, USDCHF, AUDUSD, USDCAD]
    disposition: accepted_exception
    owner: execution_research
    rationale: "Marginal tail breaches (0.10..0.11) observed in catch-up period; remaining high-priority gates pass."
    review_cadence_days: 30
    evidence_link: docs/analysis/oco_execution_risk_report.md
