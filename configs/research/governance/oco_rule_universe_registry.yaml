change_control:
  owner: research_lead
  ticket: OCO-GOV-002
  rationale: >
    Widen allowed_barrier_keep from [2, 3] to [2, 3, 5] so 5-pip barriers
    become eligible for selection. The 2026-05-20 rebuild observed that
    [2, 3] was so restrictive only EURUSD exported a model; non-EURUSD
    symbols had every candidate filtered out at the barrier_keep gate.
    Barrier 5 is already in the mining grid (2, 3, 5, 8, 10) and
    structurally well-tested. Adding 5 alone — not the full grid — keeps
    per-fill bleed manageable for current execution costs.
