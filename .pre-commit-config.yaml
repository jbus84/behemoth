repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: ["--unsafe"]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=2048"]
  - repo: local
    hooks:
      - id: ruff
        name: ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
        files: ^(scripts|tests)/
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        files: ^(scripts|tests)/
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        pass_filenames: false
        args: ["scripts"]
      - id: xenon
        name: xenon complexity check
        entry: uv run xenon
        language: system
        types: [python]
        files: ^(scripts|tests)/
        args: ["--max-absolute", "F", "--max-modules", "E", "--max-average", "C"]
      - id: docs-contract
        name: docs contract
        entry: make docs-contract
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: docs-build
        name: docs build
        entry: make docs-build
        language: system
        pass_filenames: false
        stages: [pre-push]
