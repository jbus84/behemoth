route:
  group_by: ['alertname', 'symbol']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'

receivers:
  - name: 'default-receiver'
    email_configs:
      - to: 'danielfisher0@gmail.com'
        from: '${SMTP_FROM}'
        smarthost: '${SMTP_HOST}'
        auth_username: '${SMTP_USER}'
        auth_password: '${SMTP_PASS}'
        require_tls: true
